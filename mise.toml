min_version = "2025.7.0"

[tools]
node = "22"
python = "3.13"

[tasks.configure]
description = "Configure ReactEdge integrations"
run = "./launcher/scripts/widgets-configure.sh"

[tasks."configure-ui"]
description = "Try the local configuration control panel"
run = "node --experimental-strip-types launcher/control-panel/server.ts"

[tasks."serve"]
description = "Expose the ReactEdge workspace over HTTP"
run = "./launcher/scripts/widgets-serve.sh"

[tasks."widget-dev"]
description = "Run a widget in development mode"
depends = ["widgets-clean"]
run = "./launcher/scripts/widget-dev.sh {{arg(name='widget', required=true)}}"

[tasks."widget-test"]
description = "Test a widget locally"
depends = ["widgets-clean"]
run = "./launcher/scripts/widget-test.sh {{arg(name='widget', required=true)}} {{arg(name='debug', required=false)}}"

[tasks."widgets-clean"]
description = "Kill all widget development servers"
run = "./launcher/scripts/widgets-clean.sh"

[tasks."widget-build"]
description = "Compiles a widget"
run = "./launcher/scripts/widget-build.sh {{arg(name='widget', required=true)}}"

[tasks."widgets-build-manifest"]
description = "Build the ReactEdge deployment orchestrator"
run = "./launcher/scripts/widgets-build-manifest.sh"

[tasks."widgets-deploy"]
description = "Build the ReactEdge deployment orchestrator"
run = "./launcher/scripts/widgets-deploy.sh"

[tasks."widgets-test"]
description = "Test the ReactEdge deployed widgets"
run = "./launcher/scripts/widgets-test.sh"

[tasks.complexity]
description = "Check Lizard complexity for one widget: mise run complexity -- <widget>"
tools = {uv = "latest", "pipx:lizard" = "1.24.1"}
run = "./launcher/scripts/widget-complexity.sh {{arg(name='widget', required=true)}}"
