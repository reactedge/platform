<!DOCTYPE html>
<html>

<body>

<script type="module">
    import { mount } from './api/widget.tsx';
    import { ResourceLoader } from "@reactedge/framework/contract";

    const loader = new ResourceLoader();
    const contract = await loader.loadContract("default.json");

    const element = document.querySelector('cmsblock-widget');

    await requestAnimationFrame(() => {
        mount(element, contract);
    })
</script>

<cmsblock-widget></cmsblock-widget>

</body>
</html>
