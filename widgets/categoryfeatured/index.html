<!DOCTYPE html>
<html>

<body>

<script type="module">
    import { mount } from './api/widget.tsx';
    import { ResourceLoader } from "@reactedge/framework/contract";

    const loader = new ResourceLoader();
    const contract = await loader.loadContract("default.json");
    const bootstrap = await loader.loadContract("data.json");

    const element = document.querySelector('categoryfeatured-widget');

    await requestAnimationFrame(() => {
        mount(element, contract, bootstrap);
    })
</script>

<categoryfeatured-widget></categoryfeatured-widget>

</body>
</html>
