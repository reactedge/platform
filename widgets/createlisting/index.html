<!DOCTYPE html>
<html>
<body>

<createlisting-widget></createlisting-widget>

<script type="module">
    import { mount } from "./api/runtime-shadow-widget.tsx";
    import { ResourceLoader } from "@reactedge/framework/contract";

    const loader = new ResourceLoader();

    const contract = await loader.loadContract("default.json");
    const runtime = {};
    const bootstrap = undefined

    const element = document.querySelector("createlisting-widget");

    if (!element) {
        throw new Error(
            "createlisting-widget element not found"
        );
    }

    requestAnimationFrame(() => {
        mount(element, contract, bootstrap, runtime);
    });
</script>

</body>
</html>
