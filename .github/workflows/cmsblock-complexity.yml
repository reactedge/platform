name: CMSBlock complexity

on:
  push:
    branches:
      - feat/cms-block
    paths:
      - 'widgets/cmsblock/**'
      - '.github/workflows/cmsblock-complexity.yml'
      - 'mise.toml'
      - 'launcher/scripts/widget-complexity.sh'
  pull_request:
    paths:
      - 'widgets/cmsblock/**'
      - '.github/workflows/cmsblock-complexity.yml'
  workflow_dispatch:

jobs:
  lizard:
    name: Lizard (CCN <= 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install: false
      - name: Analyze CMSBlock source and widget API
        run: mise run complexity -- cmsblock
