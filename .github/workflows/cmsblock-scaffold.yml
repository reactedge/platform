name: CMSBlock scaffold

on:
  push:
    branches:
      - feat/cms-block
    paths:
      - 'services/cmsblock/**'
      - '.github/workflows/cmsblock-scaffold.yml'
  pull_request:
    paths:
      - 'services/cmsblock/**'
      - '.github/workflows/cmsblock-scaffold.yml'
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/cmsblock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck scaffold
        run: npm run typecheck
      - name: Verify CMSBlock legacy HTTP lifecycle
        run: npm test
      - name: Start scaffold and verify status
        shell: bash
        run: |
          set -euo pipefail
          PORT=4190 npm start > /tmp/reactedge-cmsblock.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4190/cmsblock/status > /tmp/cmsblock-status.json; then
              node -e "const fs=require('fs'); const status=JSON.parse(fs.readFileSync('/tmp/cmsblock-status.json','utf8')); if(status.status!=='ok')process.exit(1);"
              cat /tmp/cmsblock-status.json
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/reactedge-cmsblock.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/reactedge-cmsblock.log
          echo "CMSBlock failed to serve /cmsblock/status" >&2
          exit 1
